[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-tool"
version = "0.1.0"
description = "Build, query and maintain a Markdown knowledge wiki with headless Claude Code runs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
convert = ["python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23", "pypdf>=4.0"]
test = ["pytest>=8"]

[project.scripts]
wiki = "wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: spends real money through the ledger; runs only with WIKI_LIVE=1"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
